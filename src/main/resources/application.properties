# ==========================================
# CONFIGURACIÓN — ventas-backend-quarkus
# ==========================================

# ------------------------------------------
# BASE DE DATOS
# ------------------------------------------
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DATABASE_USER:admin}
quarkus.datasource.password=${DATABASE_PASSWORD:Admin@12345!}
quarkus.datasource.jdbc.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/bdventas}
quarkus.datasource.jdbc.min-size=2
quarkus.datasource.jdbc.max-size=10

# ------------------------------------------
# FLYWAY (migraciones de BD)
# ------------------------------------------
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.locations=classpath:db/migration

# ------------------------------------------
# HIBERNATE ORM
# ------------------------------------------
quarkus.hibernate-orm.schema-management.strategy=validate
#quarkus.hibernate-orm.database.generation=validate
quarkus.hibernate-orm.log.sql=false

# ------------------------------------------
# JWT
# ------------------------------------------
mp.jwt.verify.issuer=${JWT_ISSUER:ventas-app}
mp.jwt.verify.publickey.location=publicKey.pem
smallrye.jwt.sign.key.location=privateKey.pem
mp.jwt.verify.groups.header=groups

# ------------------------------------------
# CORS - versión actualizada para Quarkus 3.17
# ------------------------------------------
quarkus.rest.cors.origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
quarkus.rest.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.rest.cors.headers=Content-Type,Authorization
quarkus.rest.cors.exposed-headers=Content-Disposition

# ------------------------------------------
# SERVIDOR
# ------------------------------------------
quarkus.http.port=${PORT:8080}

# ------------------------------------------
# SWAGGER UI con soporte JWT
# ------------------------------------------
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui
quarkus.smallrye-openapi.info-title=API Sistema de Ventas
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.security-scheme=jwt
quarkus.smallrye-openapi.security-scheme-name=bearerAuth
quarkus.smallrye-openapi.jwt-security-scheme-value=bearer

# ------------------------------------------
# SEGURIDAD JWT
# ------------------------------------------
quarkus.http.auth.basic=false
quarkus.http.auth.proactive=true

# Duración tokens (segundos)
# 3600 = 1 hora
# 604800 = 7 días
app.token.access.duration=3600
app.token.refresh.duration=604800